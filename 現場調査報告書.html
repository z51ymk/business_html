<title>現場調査報告書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16252E;        /* 濃紺インク */
  --paper:#F5F6F3;      /* 用紙 */
  --card:#FFFFFF;
  --fiber:#F1BE2A;      /* シングルモード心線の黄 */
  --cyan:#1E8496;       /* 接続点 */
  --mute:#5B6A70;
  --line:#DCE1E0;
  --req:#C5432F;
  --ok:#2E8B57;
  --r:10px;
  --sans:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}

/* ---- ヘッダー ---- */
.top{background:var(--ink);color:#fff;padding:12px 18px 12px;padding-top:calc(12px + env(safe-area-inset-top));position:relative;overflow:hidden}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(90deg,var(--fiber) 0 28px,transparent 28px 34px)}
.top .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--fiber)}
.top h1{margin:0 0 2px;font-size:19px;font-weight:700;letter-spacing:.02em}
.top p{margin:0;font-size:12px;color:#B9C6CC}
.status{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:12px;color:#B9C6CC;font-family:var(--mono)}
.meter{flex:1;height:6px;border-radius:3px;background:#2B3E48;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--fiber);transition:width .3s}

/* ---- 本体：左に光ケーブルのルート線 ---- */
main{max-width:760px;margin:0 auto;padding:18px 14px 140px;position:relative}
.route{position:relative;padding-left:30px}
.route::before{content:"";position:absolute;left:10px;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--fiber)}
section{position:relative;margin-bottom:18px}
section::before{content:"";position:absolute;left:-26px;top:14px;width:13px;height:13px;border-radius:50%;background:var(--paper);border:3px solid var(--cyan)}
section.done::before{background:var(--cyan)}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;padding-top:8px}
.sec-h h2{margin:0;font-size:17px}
.sec-h small{font-size:12px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* ---- 入力 ---- */
.f{margin-bottom:14px}
.f:last-child{margin-bottom:0}
label.l{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:5px}
.req label.l::after{content:"必須";font-size:10px;font-weight:700;color:#fff;background:var(--req);border-radius:3px;padding:1px 5px}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{
  width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#FBFCFB;font-size:16px;-webkit-appearance:none;appearance:none}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);background:#fff;box-shadow:0 0 0 3px rgba(30,132,150,.15)}
.err input{border-color:var(--req);background:#FFF6F4}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row .f{margin-bottom:0}
.grp{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.grp-t{font-size:13px;font-weight:700;color:var(--cyan);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.grp-t::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--cyan)}
.unit{position:relative}
.unit input{padding-right:40px;font-family:var(--mono)}
.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:14px}

/* 選択チップ */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips label{position:relative;cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-flex;align-items:center;min-height:40px;padding:8px 13px;border:1.5px solid var(--line);border-radius:999px;font-size:14px;background:#fff;user-select:none}
.chips input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.chips input[type=checkbox]:checked+span::before{content:"✓";margin-right:5px;color:var(--fiber);font-weight:700}
.chips input:focus-visible+span{outline:3px solid var(--cyan);outline-offset:2px}

/* 写真 */
.photos{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.ph{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:8px;background:#FBFCFB}
.ph .thumb{position:relative;width:96px;height:96px;border-radius:6px;overflow:hidden;background:#eee}
.ph .thumb b{position:absolute;left:4px;top:4px;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:#fff;font-size:12px;font-family:var(--mono);display:flex;align-items:center;justify-content:center;padding:0 5px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{display:flex;flex-direction:column;gap:4px}
.ph textarea{min-height:96px;font-size:15px;padding:8px 10px}
.ph .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
.ph .meta button{border:0;background:none;color:var(--req);font-size:13px;font-weight:700;cursor:pointer;padding:4px 2px}
.addph{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border:1.5px dashed var(--cyan);border-radius:8px;color:var(--cyan);font-weight:700;cursor:pointer;background:#F3FAFB}
.addph input{display:none}
.hint{font-size:12px;color:var(--mute);margin-top:6px}

/* ---- 下部操作バー ---- */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));z-index:10}
.bar-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr 1.3fr;gap:8px}
.btn{min-height:48px;border-radius:9px;border:1.5px solid var(--ink);background:#fff;font-size:13px;font-weight:700;cursor:pointer;padding:4px}
.btn.pri{background:var(--ink);color:#fff}
.btn:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sub{display:flex;gap:14px;justify-content:center;margin-top:6px;font-size:12px}
.sub button{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:4px}

/* 調査日時 */
.dt{display:flex;align-items:center;gap:8px}
.dt input{flex:1}
.wd{flex:none;min-width:48px;font-weight:700;font-size:16px;color:var(--cyan)}
.tm{display:flex;align-items:center;gap:6px;margin-top:8px}
.hm{flex:1;display:flex;align-items:center;gap:3px}
.hm select{text-align:center;padding:10px 4px;font-family:var(--mono);background-image:none}
.hm b{color:var(--mute)}
.tilde{flex:none;font-weight:700;color:var(--mute)}

/* ---- プレビュー ---- */
.pv{position:fixed;inset:0;z-index:30;background:#3A474D;display:flex;flex-direction:column}
.pv[hidden]{display:none}
.pv-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--ink);color:#fff;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
.pv-bar button{background:none;border:1.5px solid #5D6E76;color:#fff;border-radius:8px;min-height:40px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer}
.pv-bar span{font-size:13px;color:#B9C6CC}
.pv-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 0}
#pv-wrap{margin:0 auto;transform-origin:top left}
.page{width:794px;height:1123px;background:#fff;padding:45px 45px 40px;margin:0 0 16px;box-shadow:0 4px 18px rgba(0,0,0,.35);position:relative;overflow:hidden;color:var(--ink);font-size:13px;line-height:1.5}
.page .pn{position:absolute;bottom:16px;right:45px;font-size:10px;color:#7D8A90;font-family:var(--mono)}
.pv-act{flex:none;background:#fff;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.pv-act-in{max-width:760px;margin:0 auto}
.pv-act input{width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:16px;margin-bottom:8px}
.pv-act input:focus{outline:none;border-color:var(--cyan)}
.pv-btns{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:8px}
.btn:disabled{opacity:.5}

/* 帳票 */
.page>.body{position:relative}
.rp{font-size:var(--fs,11.5px)}
.rp-h{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--ink);padding-bottom:6px;margin-bottom:10px}
.rp-h h1{font-size:22px;margin:0;letter-spacing:.04em;line-height:1.25}
.rp-h h1 small{display:block;font-size:10.5px;font-weight:700;color:var(--cyan);letter-spacing:.08em}
.rp-h .meta{font-size:11px;text-align:right;line-height:1.55}
.rp-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;align-items:start}
.rp-col{display:flex;flex-direction:column;gap:9px}
.rp-full{margin-top:9px}
.rp-s h2{font-size:1.05em;margin:0 0 3px;padding:3px 7px;background:#E9EDEC;border-left:5px solid var(--fiber);line-height:1.4}
.rp-s table{width:100%;border-collapse:collapse;table-layout:fixed}
.rp-s th,.rp-s td{border:1px solid #B8C0C0;padding:3px 6px;text-align:left;vertical-align:top;font-size:1em;line-height:1.45;overflow-wrap:anywhere}
.rp-s th{width:8.4em;background:#F6F8F7;font-weight:700}
.rp-full th{width:8.4em}
.rp-full td{min-height:3em}
.rp-s tr.cm td{height:var(--ch,3.2em)}
.rp-full tr.cm td{height:var(--chf,4.8em)}
.sig{display:flex;justify-content:flex-end;margin-top:14px}
.sig-box{display:flex;align-items:flex-end;gap:10px;width:330px;font-size:12px;font-weight:700}
.sig-box span{flex:none;padding-bottom:3px}
.sig-box i{flex:1;height:38px;border-bottom:1.5px solid var(--ink)}
/* 写真ページ */
.ph-h{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--ink);padding-bottom:5px;margin-bottom:10px}
.ph-h h1{font-size:16px;margin:0}
.ph-h .meta{font-size:10.5px;text-align:right;line-height:1.5}
.ph-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,232px);gap:10px 14px}
.ph-grid figure{margin:0;display:flex;flex-direction:column;border:1px solid #B8C0C0;overflow:hidden}
.ph-grid img{width:100%;height:150px;object-fit:cover;display:block;background:#EEF1F0;border-bottom:1px solid #B8C0C0}
.ph-grid figcaption{flex:1;padding:4px 7px;font-size:10.5px;line-height:1.5;overflow-wrap:anywhere;overflow:hidden}
.ph-grid figcaption b{display:inline-block;min-width:20px;margin-right:5px;padding:0 4px;background:var(--ink);color:#fff;border-radius:3px;text-align:center;font-family:var(--mono);font-size:10px}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  body>*:not(#pv){display:none!important}
  .pv{position:static;display:block;background:#fff}
  .pv-bar,.pv-act{display:none!important}
  .pv-scroll{overflow:visible;padding:0}
  #pv-wrap{transform:none!important;height:auto!important;width:auto!important}
  .page{box-shadow:none;margin:0;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
}
@media (max-width:420px){
  .row{grid-template-columns:1fr}
  .row .f{margin-bottom:12px}
  .row .f:last-child{margin-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <h1>現場調査報告書</h1>
  <p>入力内容はこの端末に自動保存されます</p>
  <div class="status"><span>必須</span><div class="meter"><i id="meter"></i></div><span id="cnt">0/10</span></div>
</header>

<main>
<form id="form" class="route" novalidate autocomplete="off">

  <!-- 1. 基本情報 -->
  <section data-sec="basic">
    <div class="sec-h"><h2>基本情報</h2><small>案件・関係者</small></div>
    <div class="card">
      <div class="f req"><label class="l" for="pj">PJ名</label><input type="text" id="pj" name="PJ名" required></div>
      <div class="f req"><label class="l" for="company">会社名（お客様）</label><input type="text" id="company" name="会社名" required></div>
      <div class="row f">
        <div class="f req"><label class="l" for="site">拠点名</label><input type="text" id="site" name="拠点名" required></div>
        <div class="f req"><label class="l" for="bldg">ビル名</label><input type="text" id="bldg" name="ビル名" required></div>
      </div>
      <div class="f"><label class="l" for="date">調査日時</label>
        <div class="dt"><input type="date" id="date" name="調査日"><span class="wd" id="wd">（−）</span></div>
        <div class="tm">
          <div class="hm"><select id="t1h" name="開始時" aria-label="開始 時"></select><b>:</b><select id="t1m" name="開始分" aria-label="開始 分"></select></div>
          <span class="tilde">〜</span>
          <div class="hm"><select id="t2h" name="終了時" aria-label="終了 時"></select><b>:</b><select id="t2m" name="終了分" aria-label="終了 分"></select></div>
        </div>
      </div>
      <div class="f"><label class="l" for="addr">所在地</label><input type="text" id="addr" name="所在地" placeholder="例：東京都千代田区大手町1-1-1"></div>

      <div class="grp">
        <div class="grp-t">立会い者様情報</div>
        <div class="row">
          <div class="f req"><label class="l" for="w_name">氏名</label><input type="text" id="w_name" name="立会い者様" required></div>
          <div class="f req"><label class="l" for="w_tel">連絡先</label><input type="tel" id="w_tel" name="立会い者様連絡先" inputmode="tel" required></div>
        </div>
      </div>

      <div class="grp">
        <div class="grp-t">作業会社情報</div>
        <div class="f req"><label class="l" for="c_name">作業会社名</label><input type="text" id="c_name" name="作業会社名" required></div>
        <div class="row">
          <div class="f req"><label class="l" for="c_person">担当者名</label><input type="text" id="c_person" name="作業担当者名" required></div>
          <div class="f req"><label class="l" for="c_tel">連絡先</label><input type="tel" id="c_tel" name="作業担当者連絡先" inputmode="tel" required></div>
        </div>
      </div>

      <div class="grp">
        <div class="f req"><label class="l" for="db">dB担当者名</label><input type="text" id="db" name="dB担当者名" required></div>
      </div>
    </div>
  </section>

  <!-- 2. ビル情報 -->
  <section data-sec="bldg">
    <div class="sec-h"><h2>ビル情報</h2><small>入館・作業条件</small></div>
    <div class="card">
      <div class="row f">
        <div class="f"><label class="l" for="floor">入居フロア</label><input type="text" id="floor" name="入居フロア" placeholder="例：5F"></div>
        <div class="f"><label class="l" for="floors">建物階数</label><input type="text" id="floors" name="建物階数" placeholder="例：地上10F／地下1F"></div>
      </div>
      <div class="row f">
        <div class="f"><label class="l" for="mgr">ビル管理会社</label><input type="text" id="mgr" name="ビル管理会社"></div>
        <div class="f"><label class="l" for="mgr_tel">管理会社 連絡先</label><input type="tel" id="mgr_tel" name="管理会社連絡先" inputmode="tel"></div>
      </div>
      <div class="f"><label class="l">工事申請</label>
        <div class="chips" data-name="工事申請">
          <label><input type="radio" name="工事申請" value="要"><span>要</span></label>
          <label><input type="radio" name="工事申請" value="不要"><span>不要</span></label>
          <label><input type="radio" name="工事申請" value="確認中"><span>確認中</span></label>
        </div>
      </div>
      <div class="f"><label class="l">作業可能時間</label>
        <div class="chips">
          <label><input type="checkbox" name="作業可能時間" value="平日日中"><span>平日日中</span></label>
          <label><input type="checkbox" name="作業可能時間" value="平日夜間"><span>平日夜間</span></label>
          <label><input type="checkbox" name="作業可能時間" value="土日祝"><span>土日祝</span></label>
        </div>
      </div>
      <div class="f"><label class="l" for="bldg_note">コメント</label><textarea id="bldg_note" name="入館メモ" placeholder="例：防災センターで受付、ビル内パーキング使用可、工事申請は1週間前まで"></textarea></div>
    </div>
  </section>

  <!-- 3. 引込・ルート -->
  <section data-sec="route">
    <div class="sec-h"><h2>引込・構内ルート</h2><small>電柱 → 建物 → 設置場所</small></div>
    <div class="card">
      <div class="f"><label class="l">引込方式</label>
        <div class="chips">
          <label><input type="radio" name="引込方式" value="架空"><span>架空</span></label>
          <label><input type="radio" name="引込方式" value="地下（管路）"><span>地下（管路）</span></label>
          <label><input type="radio" name="引込方式" value="既設利用"><span>既設利用</span></label>
          <label><input type="radio" name="引込方式" value="未確認"><span>未確認</span></label>
        </div>
      </div>
      <div class="row f">
        <div class="f"><label class="l" for="entry">引込口の位置</label><input type="text" id="entry" name="引込口位置" placeholder="例：1F北側外壁"></div>

      </div>
      <div class="f"><label class="l">構内ルート</label>
        <div class="chips">
          <label><input type="checkbox" name="構内ルート" value="EPS"><span>EPS</span></label>
          <label><input type="checkbox" name="構内ルート" value="既設配管"><span>既設配管</span></label>
          <label><input type="checkbox" name="構内ルート" value="天井内"><span>天井内</span></label>
          <label><input type="checkbox" name="構内ルート" value="床下"><span>床下</span></label>
          <label><input type="checkbox" name="構内ルート" value="露出（モール）"><span>露出（モール）</span></label>
        </div>
      </div>
      <div class="row f">
        <div class="f"><label class="l" for="dist">概算距離</label><div class="unit"><input type="number" id="dist" name="概算距離" inputmode="decimal" min="0"><span>m</span></div></div>
        <div class="f"><label class="l">既設配管の空き</label>

            <label><input type="radio" name="配管空き" value="あり"><span>あり</span></label>
            <label><input type="radio" name="配管空き" value="なし"><span>なし</span></label>
            <label><input type="radio" name="配管空き" value="不明"><span>不明</span></label>
          </div>
        </div>
      </div>
      <div class="f"><label class="l" for="route_note">コメント（ルートの説明など）</label><textarea id="route_note" name="ルート説明" placeholder="例：引込口 → B1F MDF → EPS で5Fへ → 天井内 → サーバ室"></textarea></div>
    </div>
  </section>

  <!-- 4. 設置位置 -->
  <section data-sec="place">
    <div class="sec-h"><h2>設置位置</h2><small>終端装置まわり</small></div>
    <div class="card">
      <div class="f"><label class="l" for="place">設置場所</label><input type="text" id="place" name="設置場所" placeholder="例：5F サーバ室 ラック内"></div>
      <div class="row f">
        <div class="f"><label class="l">電源（コンセント）</label>
          <div class="chips">
            <label><input type="radio" name="電源" value="あり"><span>あり</span></label>
            <label><input type="radio" name="電源" value="なし"><span>なし</span></label>
            <label><input type="radio" name="電源" value="増設要"><span>増設要</span></label>
          </div>
        </div>
        <div class="f"><label class="l">設置方法</label>
          <div class="chips">
            <label><input type="radio" name="設置方法" value="ラック"><span>ラック</span></label>
            <label><input type="radio" name="設置方法" value="棚・床置き"><span>棚・床置き</span></label>
            <label><input type="radio" name="設置方法" value="壁掛け"><span>壁掛け</span></label>
          </div>
        </div>
      </div>
      <div class="f"><label class="l" for="place_note">コメント</label><textarea id="place_note" name="設置メモ" placeholder="例：ラック空き2U、既設ONUの隣。電源は2口空きあり"></textarea></div>

  <!-- 5. 付帯工事 -->
  <section data-sec="extra">
    <div class="sec-h"><h2>付帯工事</h2><small>必要なものを選択</small></div>
    <div class="card">
      <div class="f"><label class="l">付帯工事の有無</label>
        <div class="chips">
          <label><input type="radio" name="付帯工事有無" value="有"><span>有</span></label>
          <label><input type="radio" name="付帯工事有無" value="無"><span>無</span></label>
        </div>
      </div>
      <div class="f" id="extra_list"><label class="l">内容</label>
        <div class="chips">
          <label><input type="checkbox" name="付帯工事" value="配管"><span>配管</span></label>
          <label><input type="checkbox" name="付帯工事" value="モール"><span>モール</span></label>
          <label><input type="checkbox" name="付帯工事" value="穴あけ・貫通"><span>穴あけ・貫通</span></label>
          <label><input type="checkbox" name="付帯工事" value="防火区画処理"><span>防火区画処理</span></label>
          <label><input type="checkbox" name="付帯工事" value="電源工事"><span>電源工事</span></label>
          <label><input type="checkbox" name="付帯工事" value="高所作業"><span>高所作業</span></label>
          <label><input type="checkbox" name="付帯工事" value="天井開口"><span>天井開口</span></label>

      <div class="f"><label class="l" for="extra_note">コメント</label><textarea id="extra_note" name="付帯工事詳細" placeholder="例：2F床 φ30貫通1箇所、天井点検口から配線、脚立3m"></textarea></div>

  <!-- 6. 写真・所見 -->
  <section data-sec="result">

        <div class="photos" id="photos"></div>
        <div class="hint">写真は2枚目以降に1ページ8枚で入ります。コメントは1枚100文字まで。写真は端末に自動保存されません。</div>

          <label><input type="radio" name="施工可否" value="施工可"><span>施工可</span></label>
          <label><input type="radio" name="施工可否" value="条件付きで可"><span>条件付きで可</span></label>

</form>

<script>
(function(){
const KEY='fiber-survey-v2';
const KKEY=KEY+'-draftkey';
function draftKey(){ // 起動元が同じでも毎回同じ場所に保存されるように、ファイルの置き場所ごとに鍵を作る
  try{
    let k=localStorage.getItem(KKEY);
    if(!k){k=Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem(KKEY,k)}
    return KEY+'-'+k;
  }catch(e){return KEY}
}
let DKEY=draftKey();
function cookieSet(k,v){try{document.cookie=k+'='+encodeURIComponent(v)+';max-age=31536000;path=/';}catch(e){}}
function cookieGet(k){try{const m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)'));return m?decodeURIComponent(m[1]):null}catch(e){return null}}
const form=document.getElementById('form');
const reqs=[...form.querySelectorAll('[required]')];
const photos=[]; // {src, cap}
const $=id=>document.getElementById(id);

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}

/* 収集・復元 */
function collect(){
  const d={};
  form.querySelectorAll('input,textarea,select').forEach(el=>{
    if(!el.name||el.type==='file')return;
    if(el.type==='checkbox'){(d[el.name]=d[el.name]||[]); if(el.checked)d[el.name].push(el.value)}
    else if(el.type==='radio'){ if(!(el.name in d))d[el.name]=''; if(el.checked)d[el.name]=el.value}
    else d[el.name]=el.value.trim();
  });
  return d;
}
function restore(d){
  form.querySelectorAll('input,textarea,select').forEach(el=>{
    if(!el.name||el.type==='file'||!(el.name in d))return;
    const v=d[el.name];
    if(el.type==='checkbox')el.checked=Array.isArray(v)&&v.includes(el.value);
    else if(el.type==='radio')el.checked=v===el.value;
    else el.value=v;
  });
  if(d['調査日']&&!d['調査日時'])$('date').value=d['調査日']; // 旧版（日付のみ）からの引き継ぎ
  showWd();
  update();
}
function save(){
  const j=JSON.stringify(collect());
  try{localStorage.setItem(DKEY,j)}catch(e){}
  try{document.cookie=KKEY.replace(/[^\w-]/g,'')+'-ck='+encodeURIComponent(j.slice(0,3500))+';max-age=31536000;path=/'}catch(e){}
}
function loadSaved(){
  try{const l=localStorage.getItem(DKEY);if(l)return l}catch(e){}
  try{const c=cookieGet(KKEY.replace(/[^\w-]/g,'')+'-ck');if(c)return c}catch(e){}
  try{return localStorage.getItem(KEY)}catch(e){return null}
}

/* 進捗・セクション完了 */
function update(){
  const n=reqs.filter(el=>el.value.trim()).length;
  $('cnt').textContent=n+'/'+reqs.length;
  $('meter').style.width=(n/reqs.length*100)+'%';
  form.querySelectorAll('section').forEach(s=>{
    const fields=[...s.querySelectorAll('input:not([type=file]),textarea')];
    const sr=[...s.querySelectorAll('[required]')];
    const done=sr.length?sr.every(e=>e.value.trim()):fields.some(e=>(e.type==='radio'||e.type==='checkbox')?e.checked:e.value.trim());
    s.classList.toggle('done',done);
  });
}
form.addEventListener('input',e=>{const f=e.target.closest('.f');if(f)f.classList.remove('err');update();save()});
form.addEventListener('change',()=>{update();save()});

function validate(){
  let first=null;
  reqs.forEach(el=>{const bad=!el.value.trim();el.closest('.f').classList.toggle('err',bad);if(bad&&!first)first=el});
  if(first){first.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>first.focus({preventScroll:true}),350);toast('必須項目が未入力です（赤枠）');return false}
  return true;
}

/* 出力用のセクション構成 */
const SECTIONS=[
  ['基本情報',['PJ名','会社名','拠点名','ビル名',['調査日時',d=>when(d)],'所在地','dB担当者名']],
  ['立会い者様情報',[['氏名',d=>d['立会い者様']],['連絡先',d=>d['立会い者様連絡先']]]],
  ['作業会社情報',['作業会社名',['担当者名',d=>d['作業担当者名']],['連絡先',d=>d['作業担当者連絡先']]]],
  ['ビル情報',['入居フロア','建物階数',['ビル管理会社',d=>join(d['ビル管理会社'],d['管理会社連絡先'])],'工事申請','作業可能時間',['コメント',d=>d['入館メモ']]]],
  ['引込・構内ルート',['引込方式','引込口位置',['MDF／主端子盤',d=>d['MDF位置']],'構内ルート',['概算距離',d=>d['概算距離']?d['概算距離']+' m':''],['既設配管の空き',d=>d['配管空き']],['コメント',d=>d['ルート説明']]]],
  ['設置位置',['設置場所','電源','設置方法',['コメント',d=>d['設置メモ']]]],
  ['付帯工事',[['有無',d=>d['付帯工事有無']],['内容',d=>d['付帯工事']],['コメント',d=>d['付帯工事詳細']]]],
  ['所見',['施工可否',['コメント',d=>d['特記事項']]]]
];
const WD='日月火水木金土';
function wday(v){if(!v)return '';const [y,m,dd]=v.split('-').map(Number);return WD[new Date(y,m-1,dd).getDay()]}
function hm(h,m){return h===''||h==null?'':h+':'+(m||'00')}
function when(d){
  let s='';
  if(d['調査日']){const [y,m,dd]=d['調査日'].split('-');s=y+'年'+Number(m)+'月'+Number(dd)+'日（'+wday(d['調査日'])+'）'}
  const a=hm(d['開始時'],d['開始分']),b=hm(d['終了時'],d['終了分']);
  if(a||b)s+=(s?'　':'')+a+'〜'+b;
  return s;
}
function join(a,b){return [a,b].filter(Boolean).join('　TEL ')}
function val(v){return Array.isArray(v)?v.join('、'):(v||'')}
function rows(d){return SECTIONS.map(([t,items])=>[t,items.map(it=>Array.isArray(it)?[it[0],val(it[1](d))]:[it,val(d[it])])])}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* テキストコピー（メール・チャット貼り付け用） */
function makeText(d){
  let t='【現場調査報告書】'+(d['PJ名']||'')+'\n';
  rows(d).forEach(([h,r])=>{
    const f=r.filter(x=>x[1]);
    if(!f.length)return;
    t+='\n■'+h+'\n'+f.map(([k,v])=>'・'+k+'：'+v).join('\n')+'\n';
  });
  if(photos.length)t+='\n（写真 '+photos.length+'枚）\n';
  return t;
}
$('b_copy').onclick=async()=>{
  const t=makeText(collect());
  try{await navigator.clipboard.writeText(t);toast('コピーしました')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('コピーしました')}
};

/* プレビュー（A4ページに割付） */
const PAGE_H=1123, PAD_T=45, PAD_B=40;
function table(t,r,cls){
  return '<div class="rp-s'+(cls?' '+cls:'')+'"><h2>'+t+'</h2><table>'+r.map(([k,v])=>'<tr'+(k==='コメント'?' class="cm"':'')+'><th>'+esc(k)+'</th><td>'+(esc(v).replace(/\n/g,'<br>')||'&nbsp;')+'</td></tr>').join('')+'</table></div>';
}
function headMeta(d){return 'PJ名：'+esc(d['PJ名'])+'<br>'+esc([d['拠点名'],d['ビル名']].filter(Boolean).join('／'))+'<br>調査日時：'+esc(when(d))}
/* 1ページ目：2段組で調査内容をA4縦1枚に収める */
function page1(d){
  const R=Object.fromEntries(rows(d));
  const left=['基本情報','立会い者様情報','作業会社情報','ビル情報'].map(t=>table(t,R[t])).join('');
  const right=['引込・構内ルート','設置位置','付帯工事'].map(t=>table(t,R[t])).join('');
  return '<div class="rp"><div class="rp-h"><h1>現場調査報告書</h1><div class="meta">'+headMeta(d)+'</div></div>'+
    '<div class="rp-cols"><div class="rp-col">'+left+'</div><div class="rp-col">'+right+'</div></div>'+
    table('所見',R['所見'],'rp-full')+
    '<div class="sig"><div class="sig-box"><span>dB担当者（署名）</span><i></i></div></div></div>';
}
/* 2ページ目以降：写真 8枚/ページ（2列×4段）＋コメント */
function photoPage(d,list,start,no,total){
  return '<div class="ph-h"><h1>現場写真 '+(start+1)+'〜'+(start+list.length)+'（全'+photos.length+'枚）</h1><div class="meta">'+headMeta(d)+'</div></div>'+
    '<div class="ph-grid">'+list.map((p,k)=>'<figure><img src="'+p.src+'" alt=""><figcaption><b>'+(start+k+1)+'</b>'+esc(p.cap||'')+'</figcaption></figure>').join('')+'</div>';
}
function newPage(wrap){const page=document.createElement('div');page.className='page';const body=document.createElement('div');body.className='body';page.appendChild(body);wrap.appendChild(page);return body}
function buildPages(){
  const wrap=$('pv-wrap');wrap.innerHTML='';
  const d=collect();
  const avail=PAGE_H-PAD_T-PAD_B-8;
  /* 1ページ目：はみ出す場合は文字を段階的に縮小して1枚に収める */
  const b1=newPage(wrap);b1.innerHTML=page1(d);
  const rp=b1.firstElementChild;
  /* 余白が多ければ文字を大きく、はみ出すなら小さくして1枚に収める */
  let fs=13.5;rp.style.setProperty('--fs',fs+'px');
  while(fs>8.5&&b1.offsetHeight>avail){fs-=0.25;rp.style.setProperty('--fs',fs+'px')}
  /* 残った余白はコメント欄の高さに回す（記入スペースとして使える） */
  let ch=3.2;
  while(ch<9){
    rp.style.setProperty('--ch',(ch+0.4)+'em');rp.style.setProperty('--chf',(ch*1.5+0.6)+'em');
    if(b1.offsetHeight>avail){rp.style.setProperty('--ch',ch+'em');rp.style.setProperty('--chf',(ch*1.5)+'em');break}
    ch+=0.4;
  }
  for(let i=0;i<photos.length;i+=8){
    newPage(wrap).innerHTML=photoPage(d,photos.slice(i,i+8),i);
  }
  const pages=[...wrap.querySelectorAll('.page')];
  pages.forEach((p,i)=>{const n=document.createElement('div');n.className='pn';n.textContent=(i+1)+' / '+pages.length;p.appendChild(n)});
  $('pv_info').textContent='プレビュー（A4・'+pages.length+'枚）';
  fitPages();
}
function fitPages(){
  const wrap=$('pv-wrap');const n=wrap.children.length;if(!n)return;
  const sc=Math.min(1,(document.documentElement.clientWidth-24)/794);
  wrap.style.width='794px';wrap.style.transform='scale('+sc+')';
  wrap.style.marginLeft=Math.max(12,(document.documentElement.clientWidth-794*sc)/2)+'px';
  wrap.style.height=((1123+16)*n*sc)+'px';
}
window.addEventListener('resize',()=>{if(!$('pv').hidden)fitPages()});

$('b_print').onclick=async()=>{
  if(!validate())return;
  try{await document.fonts.ready}catch(e){}
  $('pv').hidden=false;document.body.style.overflow='hidden';
  buildPages();$('pv_scroll').scrollTop=0;
  try{$('mail_to').value=localStorage.getItem(KEY+'-to')||''}catch(e){}
};
$('pv_close').onclick=()=>{$('pv').hidden=true;document.body.style.overflow=''};
$('pv_print').onclick=()=>window.print();
$('mail_to').oninput=e=>{try{localStorage.setItem(KEY+'-to',e.target.value)}catch(err){}};

/* PDF生成（必要時にライブラリを読み込み） */
function loadJS(src){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ng(new Error(src));document.head.appendChild(s)})}
async function libs(){
  if(!window.html2canvas)await loadJS('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  if(!(window.jspdf&&window.jspdf.jsPDF))await loadJS('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
}
function fileName(){
  const d=collect();
  return ['現場調査報告書',d['PJ名'],d['拠点名'],(d['調査日']||'').replace(/-/g,'')].filter(Boolean).join('_').replace(/[\\/:*?"<>|\s]/g,'')+'.pdf';
}
async function makePDF(){
  await libs();
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff';
  [...$('pv-wrap').children].forEach(p=>{const c=p.cloneNode(true);c.style.boxShadow='none';c.style.margin='0';host.appendChild(c)});
  document.body.appendChild(host);
  try{
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    const pages=[...host.children];
    for(let i=0;i<pages.length;i++){
      const cv=await html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,width:794,height:1123});
      if(i)pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg',.88),'JPEG',0,0,210,297);
    }
    return new File([pdf.output('blob')],fileName(),{type:'application/pdf'});
  }finally{host.remove()}
}
function download(file){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function busy(btn,label,fn){
  const old=btn.innerHTML;btn.disabled=true;btn.textContent=label;
  try{await fn()}catch(e){console.error(e);toast('PDFを作成できません：通信環境を確認してください')}
  finally{btn.disabled=false;btn.innerHTML=old}
}
$('pv_pdf').onclick=e=>busy(e.currentTarget,'作成中…',async()=>{download(await makePDF());toast('PDFを保存しました')});
$('pv_mail').onclick=e=>busy(e.currentTarget,'作成中…',async()=>{
  const d=collect();
  const subject='【現場調査報告書】'+[d['PJ名'],d['拠点名'],d['ビル名']].filter(Boolean).join(' / ');
  const text=makeText(d);
  const file=await makePDF();
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:subject,text:text});return}
    catch(err){if(err.name==='AbortError')return}
  }
  // 共有に対応しない環境：PDFを保存してメール作成画面を開く
  download(file);
  const body=text.slice(0,1500)+'\n\n※ 添付：'+file.name+'（ダウンロードしたPDFを添付してください）';
  setTimeout(()=>{location.href='mailto:'+encodeURIComponent($('mail_to').value.trim()).replace(/%2C/gi,',').replace(/%40/g,'@')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)},400);
  toast('PDFを保存しました。メールに添付してください');
});

/* データ保存・読込（JSON） */
$('b_save').onclick=()=>{
  const d=collect();
  const name=['調査',d['PJ名'],d['拠点名'],d['調査日']].filter(Boolean).join('_').replace(/[\\/:*?"<>|\s]/g,'')||'調査';
  const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('データを保存しました');
};
$('b_load').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{restore(JSON.parse(r.result));save();toast('データを読み込みました')}catch(err){toast('読み込めません：JSON形式のファイルを選んでください')}};
  r.readAsText(f);e.target.value='';
};
$('b_clear').onclick=()=>{
  if(!confirm('入力内容と写真をすべて消去します。よろしいですか？'))return;
  form.reset();photos.length=0;renderPhotos();try{localStorage.removeItem(DKEY)}catch(e){}
  try{document.cookie=KKEY.replace(/[^\w-]/g,'')+'-ck=;max-age=0;path=/'}catch(e){}
  $('date').value=today();showWd();form.querySelectorAll('.err').forEach(x=>x.classList.remove('err'));update();toast('消去しました');
};

/* 写真（縮小して保持） */
$('photo').onchange=e=>{
  [...e.target.files].forEach(file=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(1,1280/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      photos.push({src:c.toDataURL('image/jpeg',.8),cap:''});URL.revokeObjectURL(url);renderPhotos();
    };
    img.src=url;
  });
  e.target.value='';
};
function renderPhotos(){
  const box=$('photos');box.innerHTML='';
  photos.forEach((p,i)=>{
    const el=document.createElement('div');el.className='ph';
    el.innerHTML='<div class="thumb"><img alt=""><b>'+(i+1)+'</b></div><div class="cap"><textarea maxlength="100" placeholder="コメント（例：1F北側外壁の引込口。既設配管φ25に空きあり）"></textarea><div class="meta"><span class="cnt"></span><button type="button">削除</button></div></div>';
    el.querySelector('img').src=p.src;
    const ta=el.querySelector('textarea'),c=el.querySelector('.cnt');
    const upd=()=>c.textContent=ta.value.length+' / 100';
    ta.value=p.cap;upd();ta.oninput=()=>{p.cap=ta.value;upd()};
    el.querySelector('button').onclick=()=>{if(confirm('写真'+(i+1)+'を削除しますか？')){photos.splice(i,1);renderPhotos()}};
    box.appendChild(el);
  });
}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

/* 時刻の選択肢（00〜23時 / 00〜59分） */
function fillTime(){
  const pad=n=>String(n).padStart(2,'0');
  const opt=(n)=>'<option value="">--</option>'+Array.from({length:n},(_,i)=>'<option value="'+pad(i)+'">'+pad(i)+'</option>').join('');
  ['t1h','t2h'].forEach(id=>$(id).innerHTML=opt(24));
  ['t1m','t2m'].forEach(id=>$(id).innerHTML=opt(60));
}
function showWd(){const w=wday($('date').value);$('wd').textContent=w?'（'+w+'）':'（−）'}
$('date').addEventListener('input',showWd);$('date').addEventListener('change',showWd);
fillTime();

/* 起動 */
try{const s=loadSaved();if(s)restore(JSON.parse(s))}catch(e){}
if(!$('date').value)$('date').value=today();
showWd();update();
})();
